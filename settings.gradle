pluginManagement {
    plugins {
        id "com.jfrog.artifactory" version settings['jfrog-artifactory-plugin.version']
        id("io.github.gradle-nexus.publish-plugin") version("2.0.0") apply(false)
        id "org.sonarqube" version settings['sonarqube.version']
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.namespace == 'com.jfrog') {
                useModule("org.jfrog.buildinfo:build-info-extractor-gradle:${settings['jfrog-artifactory-plugin.version']}")
            }
        }
    }
}
rootProject.name="org.octopusden.octopus-release-management"
include("docs")
