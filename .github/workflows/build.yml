name: Gradle Compile & UT

# Pull requests run this through merge-gate.yml, not on their own.
on:
  push:
    branches: [ main ]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-build-and-deploy:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-build.yml@v3.0.0
    with:
      flow-type: hybrid
      java-version: '11'
