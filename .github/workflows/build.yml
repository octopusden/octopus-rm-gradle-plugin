# PUBLIC — reusable build (compile + unit tests). Runs on push and on manual dispatch, and is
# called by merge-gate.yml on pull requests, so it does not trigger on pull_request itself.
name: Gradle Compile & UT

on:
  push:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-build-and-deploy:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-build.yml@v3.0.0
    with:
      flow-type: hybrid
      java-version: '11'
