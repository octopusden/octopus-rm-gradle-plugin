name: Gradle Release

on:
  repository_dispatch:
    types: release

# contents: write to create the tag, the GitHub release and its assets.
permissions:
  contents: write

jobs:
  build:
    uses: octopusden/octopus-base/.github/workflows/common-java-gradle-release.yml@v3.0.0
    with:
      flow-type: hybrid
      java-version: '11'
      commit-hash: ${{ github.event.client_payload.commit }}
      build-version: ${{ github.event.client_payload.project_version }}
    secrets: inherit
